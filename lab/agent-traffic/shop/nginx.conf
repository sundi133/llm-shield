# Nginx in front of the lab shop. Two jobs:
#  1. Write the access log the analysis reads (one JSON object per request),
#     shaped like what a CDN or WAF ships to a SIEM.
#  2. Act as the customer's existing edge for the enforcement handoff
#     (spec section 5): it loads Shield's indicator maps and sends matching
#     requests to the challenge page. Shield writes the maps; Nginx enforces.

worker_processes 1;
events { worker_connections 1024; }

http {
    map_hash_bucket_size 512;
    map_hash_max_size 8192;

    # Client IP: the lab's agents arrive through simulated residential proxies
    # and carry X-Forwarded-For. People browsing directly have none and share
    # the Docker gateway address, which behaves like an office NAT.
    map $http_x_forwarded_for $client_ip {
        default $http_x_forwarded_for;
        ""      $remote_addr;
    }

    # Indicator maps, rewritten by analysis/indicators.py.
    map $cookie_sid $shield_sid {
        default "";
        include /etc/nginx/shield/sid.map;
    }
    map "$http_user_agent|$http_sec_ch_ua_platform|$http_accept_language" $shield_fp {
        default "";
        include /etc/nginx/shield/fp.map;
    }
    map $client_ip $shield_net {
        default "";
        include /etc/nginx/shield/net.map;
    }
    map "$shield_sid$shield_fp$shield_net" $shield_hit {
        default "1";
        ""      "";
    }

    log_format shield_json escape=json '{'
        '"ts":"$time_iso8601","msec":$msec,"ip":"$client_ip","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"req_len":$request_length,'
        '"rt":$request_time,"ua":"$http_user_agent","ref":"$http_referer",'
        '"chua":"$http_sec_ch_ua","chua_platform":"$http_sec_ch_ua_platform","al":"$http_accept_language",'
        '"sid":"$cookie_sid","sid_set":"$upstream_http_x_session","acct":"$upstream_http_x_account",'
        '"event":"$upstream_http_x_event","trip":"$upstream_http_x_tripwire","enforced":"$shield_hit",'
        '"shs":"$cookie__shs","wba":"$wba","wba_agent":"$wba_agent","decoy":"$upstream_http_x_decoy"'
    '}';
    access_log /var/log/shop/access.jsonl shield_json;

    upstream shop { server host.docker.internal:8200; }
    upstream collector { server host.docker.internal:8201; }
    upstream verifier { server host.docker.internal:8203; }
    upstream decoys { server host.docker.internal:8204; }

    server {
        listen 8180;
        # Tier 2 (spec 2.3): the tag and its beacons on a first-party path.
        # Never challenged, so a flagged session keeps reporting.
        # T2/T3 canary links (spec 2.4): the edge answers 204; the hit is this log row.
        location ^~ /_shs/v/ {
            return 204;
        }
        location /_shs/ {
            proxy_pass http://collector;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $client_ip;
        }
        # Web Bot Auth (spec 2.5): the reference verifier labels every request;
        # it never blocks, and if it is down the request goes through unlabeled.
        location = /_wba_verify {
            internal;
            proxy_pass http://verifier/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-WBA-Authority $http_host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            error_page 500 502 503 504 = @wba_open;
        }
        location @wba_open {
            return 204;
        }
        # Decoys (spec 2.6): this deployment's paths, generated by edge/decoys.py at startup.
        include /etc/nginx/shield/decoys.conf;
        location / {
            auth_request /_wba_verify;
            auth_request_set $wba $upstream_http_x_wba;
            auth_request_set $wba_agent $upstream_http_x_wba_agent;
            if ($shield_hit) { rewrite ^ /challenge break; }
            proxy_pass http://shop;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $client_ip;
        }
    }
}
