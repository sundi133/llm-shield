# Sidebar navigation — single source of truth.
#
# Rendered by the override at _includes/components/site_nav.html as flat,
# caps-header groups (Pepper-SAST style). Pages not listed here still build and
# are reachable by URL/search; they just don't clutter the sidebar.
#
# A clean 4-phase progression: learn -> product -> build -> operate.
groups:
  - title: Get Started
    items:
      - { title: Overview, url: / }
      - { title: Quickstart, url: /quickstart/ }
      - { title: FAQ, url: /faq/ }
      - { title: Glossary, url: /glossary/ }

  - title: Guardrails & Policies
    items:
      - { title: Guardrails Catalog, url: /guardrails/ }
      - { title: Agentic Guardrails, url: /agentic-guardrails-guide/ }
      # Identity comes before authorization: NHI is who is asking, RBAC is what
      # they may do. Reading them in that order is why it sits above RBAC.
      - { title: Non-Human Identity (NHI), url: /non-human-identity/ }
      # The implementation behind NHI: wire formats, PoP, revocation. It sat in
      # the repo for months as AGENT_AUTH_ARCHITECTURE.md with no front matter,
      # so it never built as a page and nothing linked it. Concept first, then
      # this — a reader who lands here without NHI meets the tokens before the
      # reason they exist.
      - { title: Agentic Identity Architecture, url: /agent-identity-architecture/ }
      - { title: Role-Based Access (RBAC), url: /rbac/ }
      - { title: Tool Data Policies, url: /tool-data-policies/ }
      - { title: Secret Vault, url: /prevent-secret-leakage/ }
      - { title: Policy Lifecycle, url: /policy-lifecycle/ }
      # AIBOM sits with the policy pages, not under Operate: the inventory is
      # what compliance mapping and drift review are computed FROM, so a reader
      # who meets Compliance Mapping first has already missed its input. It was
      # absent from this file entirely — the page shipped, nothing linked it.
      - { title: AI Bill of Materials, url: /aibom/ }
      - { title: Compliance Mapping, url: /compliance-mapping/ }

  - title: Develop
    items:
      - { title: Developer Guide — MCP & APIs, url: /developer-guide-mcp/ }
      - { title: API Reference, url: /api-reference/ }
      - { title: Connect to Your IDE, url: /connect-your-ide/ }
      - { title: MCP End-to-End Lab, url: /mcp-e2e-lab/ }
      - { title: MCP Gateway, url: /mcp-gateway/ }
      - { title: Agent Sandbox (OpenShell), url: /openshell-sandbox/ }
      - { title: Integrations, url: /integration-guide/ }

  - title: Deploy & Operate
    items:
      - { title: Installation, url: /installation-guide/ }
      - { title: Deployment (MCP Servers), url: /deployment-guide/ }
      - { title: On-Premises, url: /on-premises-deployment-guide/ }
      - { title: Workload Identity (SPIRE), url: /workload-identity-bundle/ }
      - { title: Multi-Tenant Architecture, url: /multi-tenant-architecture/ }
      - { title: Architecture, url: /architecture-diagram/ }
      - { title: Agent Run Tracing, url: /agent-run-tracing/ }
      - { title: Agent Governance, url: /agent-governance/ }
      - { title: Enterprise Features, url: /enterprise-features/ }
