title: LLM Shield
description: AI guardrails platform — input safety, output validation, and agentic security with multi-tenant policy enforcement.
remote_theme: just-the-docs/just-the-docs@v0.12.0
url: https://docs.shield.votal.ai
baseurl: ""

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Navigation
nav_external_links:
  - title: GitHub
    url: https://github.com/sundi133/llm-shield
    hide_icon: false

# Aux links (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/sundi133/llm-shield"
aux_links_new_tab: true

# Footer — leave default so "This site uses Just the Docs..." attribution shows
last_edit_timestamp: false

# Color scheme — built-in light; brand tweaks live in _sass/custom/setup.scss
color_scheme: light
logo: "/assets/images/votalai-logo.svg"

# Code copy button
enable_copy_code_button: true

# Mermaid diagrams — renders ```mermaid fences on the site (additive; pages
# without mermaid are unaffected). Used by the Workload Identity Bundle topology.
mermaid:
  version: "10.9.0"

# Heading anchors
heading_anchors: true

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Callouts
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude internal-only files
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
