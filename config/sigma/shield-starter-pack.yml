# Votal Shield starter Sigma pack.
# Import it from the portal (Custom Input Policies -> Import Sigma) or
# POST /v1/tenant/me/custom-policies/import/sigma. Stage comes from
# logsource.category; import with stage=output to also screen model output.
# Each rule's votal.tests are run in CI (tests/test_sigma_rule_pack.py);
# they are ignored on import. Secret-shaped samples are written as
# templates ({{an:N}} letters+digits, {{AN:N}} upper+digits, {{d:N}} digits,
# {{rep:X:N}} X repeated) expanded only in memory at test time, so this file
# holds no secret-shaped literal for scanners to flag.
---
title: AWS access key ID
id: 51247a6d-5c98-5396-994b-b0f7abaad817
status: stable
description: An AWS access key ID (long-term AKIA or temporary ASIA) in the text.
author: Votal Shield
date: '2026-09-26'
logsource:
  product: votal
  service: shield
  category: llm_input
detection:
  key:
    message|re: \b(?:AKIA|ASIA)[A-Z0-9]{16}\b
  condition: key
level: high
tags:
- attack.credential_access
- votal.secrets
votal:
  tests:
    match:
    - my key is AKIA{{AN:16}}, why does it fail?
    - export AWS_ACCESS_KEY_ID=ASIA{{AN:16}}
    no_match:
    - AKIA is the prefix AWS uses for access keys
    - akia{{an:16}}
---
title: Private key block
id: 715e6a84-9028-538e-b465-c5ebc780536d
status: stable
description: A PEM or PGP private key block.
author: Votal Shield
date: '2026-09-26'
logsource:
  product: votal
  service: shield
  category: llm_input
detection:
  key:
    message|re: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----'
  condition: key
level: critical
tags:
- attack.credential_access
- votal.secrets
votal:
  tests:
    match:
    - '{{rep:-:5}}BEGIN RSA PRIVATE KEY{{rep:-:5}}

      MIIEowIBAAKCAQEAx...'
    - 'here: {{rep:-:5}}BEGIN OPENSSH PRIVATE KEY{{rep:-:5}} b3BlbnNzaC1rZXk'
    - '{{rep:-:5}}BEGIN PGP PRIVATE KEY BLOCK{{rep:-:5}}'
    no_match:
    - '-----BEGIN PUBLIC KEY-----'
    - what is a private key used for?
---
title: GitHub token
id: 9aa99791-2d53-5417-a5fd-a8a70b2e5352
status: stable
description: A GitHub personal access, OAuth, app or fine-grained token.
author: Votal Shield
date: '2026-09-26'
logsource:
  product: votal
  service: shield
  category: llm_input
detection:
  classic:
    message|re: \b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b
  fine_grained:
    message|re: \bgithub_pat_[A-Za-z0-9_]{22,255}\b
  condition: classic or fine_grained
level: high
tags:
- attack.credential_access
- votal.secrets
votal:
  tests:
    match:
    - token ghp_{{an:36}} works locally
    - use github_pat_{{an:30}}_x
    no_match:
    - ghp_tooshort
    - set up a github token in settings
---
title: Slack token
id: 6da2f25e-598a-551b-8098-e73043038e62
status: stable
description: A Slack bot, user, app or refresh token.
author: Votal Shield
date: '2026-09-26'
logsource:
  product: votal
  service: shield
  category: llm_input
detection:
  key:
    message|re: \bxox[baprs]-[A-Za-z0-9-]{10,}
  condition: key
level: high
tags:
- attack.credential_access
- votal.secrets
votal:
  tests:
    match:
    - SLACK_BOT_TOKEN=xoxb-{{d:12}}-{{an:12}}
