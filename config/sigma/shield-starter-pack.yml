  service: shield
  category: llm_input
detection:
  key:
    message|re: \bsk-(?:proj-|ant-(?:api\d{2}-)?)?(?=[A-Za-z0-9_-]*\d)[A-Za-z0-9_-]{20,}
  condition: key
level: high
tags:
- attack.credential_access
- votal.secrets
votal:
  tests:
    match:
    - OPENAI_API_KEY=sk-proj-{{an:28}}
