title: Stripe live secret key
id: 3d3b8d15-33c9-56ae-82eb-0425286a662c
status: stable
description: A Stripe live secret or restricted key (test keys are ignored).
author: Votal Shield
date: '2026-09-26'
logsource:
  product: votal
  service: shield
  category: llm_input
detection:
  key:
    message|re: \b(?:sk|rk)_live_[0-9A-Za-z]{16,}\b
  condition: key
level: critical
tags:
- attack.credential_access
- votal.secrets
votal:
  tests:
    match:
    - STRIPE_KEY=sk_live_{{an:24}}
    - rk_live_{{an:20}}
    no_match:
