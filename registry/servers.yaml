# Curated list of public MCP servers to rate. One entry per server.
# Ratings are generated by scanning each `target` with shield-mcp in a sandboxed
# CI job (see .github/workflows/mcp-registry.yml). Adding a server is a reviewed
# PR: keep `pinned` accurate and `target` to exactly what the server would launch.
#
# Fields:
#   slug     url-safe id; the page permalink (^[a-z0-9-]+$), unique
#   name     human display name
#   homepage docs / listing URL
#   repo     source repo (owner/name or URL)
#   target   how shield-mcp reaches it: stdio:'<cmd args>' | sse:<url> | http:<url>
#   pinned   the version scanned (provenance); "" if unpinned
#   notes    optional

- slug: filesystem
  name: "Filesystem MCP Server"
  homepage: "https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem"
  repo: "modelcontextprotocol/servers"
  target: "stdio:npx -y @modelcontextprotocol/server-filesystem /tmp"
  pinned: ""
  notes: "Reference server; scoped to a directory arg."

