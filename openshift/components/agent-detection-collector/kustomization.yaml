# AI agent detection collector (docs/specs/agent-impersonation-defense.md,
# rev 8): the public endpoint browsers send tag beacons to. Its own pod from
# the admin image, CPU only, never the portal or the guard path.
#   oc create secret generic shield-agent-detection \
#     --from-literal=SHIELD_AGENT_DETECTION_HASH_SALT=$(openssl rand -hex 32)
# Add `../../components/agent-detection-collector` to your overlay's
# components, then route the customer's /_shs/ path to the shield-agd-collector Route.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - collector.yaml

# Let the collector reach Redis (base allows only the admin and guardrail pods).
patches:
  - target: { kind: NetworkPolicy, name: redis-ingress }
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value: { podSelector: { matchLabels: { app: shield-agd-collector } } }
