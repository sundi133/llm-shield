# For GPUs without fp8 (A100, V100, T4): serve the model in bf16 instead.
# Applies to whichever pod runs vLLM (split: shield-model; combined:
# shield-guardrail). Needs more GPU memory than fp8.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      labelSelector: shield.votal.ai/runs-vllm=true
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: VLLM_QUANTIZATION, value: none }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: VLLM_KV_CACHE_DTYPE, value: none }
