version: '3.8'

services:
  # Redis for data storage
  redis:
    image: redis:7-alpine
    container_name: llm-shield-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # LLM Shield API (Development - No GPU needed)
  llm-shield-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: llm-shield-app-dev
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SHIELD_ADMIN_KEY=admin123
      - SHIELD_AUTH_ENABLED=true
      # Auth is enabled, so at least one key must be configured or the middleware
      # rejects every request with "Auth enabled but no API keys configured".
      - SHIELD_API_KEYS=sk-test-healthcare
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      # handler.py defaults PORT to 80; the port mapping below is 8000:8000,
      # so the app must listen on 8000 inside the container or requests hit nothing.
      - PORT=8000
      # 32 workers (the prod default) is overkill for local dev and slow to boot.
      - WORKERS=4
    volumes:
      # Mount source code for live editing
      - .:/app
      - /app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
    command: python handler.py

volumes:
  redis_dev_data: