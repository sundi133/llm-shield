[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "votal-shield-langchain"
version = "0.1.0"
description = "LangChain integration SDK for Votal Shield tool authorization and output protection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Votal AI" }
]
keywords = ["langchain", "shield", "guardrails", "agents", "tools"]

dependencies = [
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/votal_shield_langchain"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true