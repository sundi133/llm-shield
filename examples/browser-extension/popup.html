<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; width: 260px; margin: 0; padding: 14px; color: #111; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    select { flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { padding: 7px 10px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    a { color: #4f46e5; cursor: pointer; }
    #result { margin-top: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .ok { color: #16a34a; } .bad { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Shield Prompt Guard</h1>
  <div class="row">
    <span>Mode</span>
    <select id="mode">
      <option value="warn">monitor</option>
      <option value="enforce">enforce</option>
      <option value="off">off</option>
    </select>
  </div>
  <div class="row">
    <button id="test">Test connection</button>
    <a id="opts">Settings</a>
  </div>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
