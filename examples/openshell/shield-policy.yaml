# OpenShell sandbox policy: allow the agent to reach ONLY the Shield gateway.
# Everything else is denied by default (unmatched endpoint -> connection denied),
# which is what makes Shield non-bypassable inside the sandbox.
#
# Apply:   openshell sandbox create --policy ./shield-policy.yaml -- bash
# Inspect: openshell policy get <name> --full
version: 1

filesystem_policy:
  read_only: [/usr, /lib, /etc, /bin]
  read_write: [/sandbox, /tmp]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  shield_gateway:
    name: shield-gateway
    endpoints:
      - host: api.guardrails.votal.ai      # the ONLY host the agent may reach
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - path: /usr/bin/curl
  # No other endpoints => the raw upstream, example.com, everything else is BLOCKED.
