# SPIRE Server — PRODUCTION profile.
#
# Differences from the dev profile (../spire/server.conf):
#   - Postgres datastore (shared across HA replicas), not SQLite
#   - x509pop node attestation (nodes prove identity with a PKI cert), not join_token
#   - UpstreamAuthority so SPIRE signs off a real intermediate CA (KMS/Vault-backed)
#   - short SVID TTL + rotation kept
#
# HA: run >= 3 replicas of this server against the same Postgres. Front them with
# a stable DNS/service name so agents reach any replica.
#
# Requires (set in the environment / mounted files):
#   SPIRE_TRUST_DOMAIN   e.g. bank-co.internal   (no default in prod)
#   SPIRE_DB_CONN        postgres://user:pass@host:5432/spire?sslmode=require
#   /run/spire/conf/agent-ca.pem            CA that signs agent x509pop certs
#   /run/spire/conf/upstream-ca.pem(+key)   intermediate signing material (KMS/Vault)
#
# Validate:  spire-server validate -expandEnv -config server.conf

server {
    bind_address          = "0.0.0.0"
    bind_port             = "8081"
    trust_domain          = "${SPIRE_TRUST_DOMAIN}"
    data_dir              = "/run/spire/data"
    log_level             = "INFO"
    ca_ttl                = "24h"
    default_x509_svid_ttl = "1h"
    # Publish the bundle so consumers (Envoy SDS, spiffe-helper) can rotate it.
    ca_subject {
        country      = ["US"]
        organization = ["Shield"]
        common_name  = "shield-spire-ca"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "postgres"
            connection_string = "${SPIRE_DB_CONN}"
        }
    }

    # Nodes attest with an X.509 cert issued by your node CA (VM/bare-metal).
    # On Kubernetes use NodeAttestor "k8s_psat" instead.
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/run/spire/conf/agent-ca.pem"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }

    # Chain SPIRE's CA to your real PKI. Swap the `disk` plugin for `vault`,
    # `awssecretsmanager`, `gcp_cas`, or `cert-manager` to keep the signing key
    # in an HSM/KMS (never on local disk in production).
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/run/spire/conf/upstream-ca.pem"
            key_file_path  = "/run/spire/conf/upstream-ca-key.pem"
        }
    }
}
