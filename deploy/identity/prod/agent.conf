# SPIRE Agent — PRODUCTION profile.
#
# Differences from dev (../spire/agent.conf):
#   - trust_bundle_path bootstrap (a pre-shared bundle), NOT insecure_bootstrap
#   - x509pop node attestation (matches the server), NOT join_token
#
# Requires:
#   SPIRE_TRUST_DOMAIN                     e.g. bank-co.internal
#   /run/spire/conf/bootstrap-bundle.pem   the server's trust bundle (pre-shared)
#   /run/spire/conf/agent.pem(+key)        this node's x509pop cert/key
#
# Validate:  spire-agent validate -expandEnv -config agent.conf

agent {
    data_dir          = "/run/spire/data"
    log_level         = "INFO"
    server_address    = "spire-server"
    server_port       = "8081"
    socket_path       = "/tmp/spire-agent/public/api.sock"
    trust_domain      = "${SPIRE_TRUST_DOMAIN}"
    # Hardened bootstrap: verify the server against a pre-shared bundle instead
    # of insecure_bootstrap.
    trust_bundle_path = "/run/spire/conf/bootstrap-bundle.pem"
}

plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/run/spire/conf/agent-key.pem"
            certificate_path = "/run/spire/conf/agent.pem"
        }
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # Identify workloads by unix uid/gid/path/sha. On Kubernetes use the `k8s`
    # workload attestor (pod + service account selectors).
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
