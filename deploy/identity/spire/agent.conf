# SPIRE Agent — attests workloads and serves SVIDs over the Workload API socket.
# The join_token is injected at first boot (see docs/identity-bundle.md).

agent {
    data_dir     = "/run/spire/data"
    log_level    = "INFO"
    server_address = "spire-server"
    server_port    = "8081"
    socket_path    = "/tmp/spire-agent/public/api.sock"
    trust_domain   = "${SPIRE_TRUST_DOMAIN}"
    # Trust bundle bootstrap: use the server's bundle. For a hardened boot use
    # trust_bundle_path with a pre-shared bundle instead of insecure_bootstrap.
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # Workload attestation: identify a process by its unix uid/gid/path/sha.
    # On k8s use the `k8s` workload attestor (pod + service account) instead.
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
