# SPIRE Server — the issuer / CA for your trust domain.
# Customer-supplied trust domain; PoC uses a file-backed CA + SQLite. For
# production: an upstream CA (or HSM/KMS via the upstream_authority plugin) and
# a Postgres datastore with 3+ replicas.

server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    # Customer-supplied. Override at deploy time.
    trust_domain = "${SPIRE_TRUST_DOMAIN:-example.org}"
    data_dir     = "/run/spire/data"
    log_level    = "INFO"
    ca_ttl       = "24h"
    default_x509_svid_ttl = "1h"   # short TTL + auto-rotation
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }

    # Node attestation (PoC: join tokens). Swap for k8s_psat / aws_iid / x509pop
    # in production so nodes attest without a shared secret.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
}
