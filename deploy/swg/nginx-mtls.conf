# mTLS terminator in front of Squid, for the public laptop SWG.
# Spec: docs/spec-swg-public-proxy.md.
#
# The laptop's PAC uses `HTTPS <host>:8443`, so it opens a TLS connection to
# the proxy and presents its MDM-issued CLIENT CERTIFICATE. nginx (stream)
# terminates that TLS, REQUIRES and verifies the client cert against the MDM
# issuing CA, and forwards the decrypted forward-proxy bytes to Squid's
# http_port, which bumps AI hosts and calls shield-icap. Squid cannot do this
# itself (ssl-bump is not allowed on a forward-mode https_port).
#
# server cert : for <host>, signed by the interception CA (trusted on devices
#               by MDM), so the client's proxy-TLS handshake succeeds.
# client CA   : the MDM issuing CA; ssl_verify_client on REQUIRES a valid cert,
#               so a laptop without one is dropped at the handshake.

worker_processes auto;
events { worker_connections 1024; }

stream {
    upstream squid { server shield-squid:3128; }

    server {
        listen 8443 ssl;
        proxy_pass squid;

        ssl_certificate         /etc/nginx/ssl/server.pem;
        ssl_certificate_key     /etc/nginx/ssl/server.key;
        ssl_client_certificate  /etc/nginx/ssl/client-ca.pem;  # MDM issuing CA
        ssl_verify_client       on;                             # REQUIRE a device cert
        ssl_verify_depth        2;
        ssl_protocols           TLSv1.2 TLSv1.3;

        # A device whose cert does not verify never reaches Squid.
        proxy_connect_timeout   10s;
        proxy_timeout           10m;
    }
}
