# Public, authenticated SWG for a roaming laptop fleet. Spec:
# docs/spec-swg-public-proxy.md.
#
# Differs from squid.conf (the in-VPC Mode A config) in two places only:
#   1. the port is a TLS proxy port requiring a per-device CLIENT CERTIFICATE
#      (mTLS), instead of a plaintext proxy allowed by source IP; and
#   2. authorization is a DESTINATION allow-list (AI hosts only), so even an
#      authenticated client cannot use it as a general relay.
# Everything below the access section (ssl_bump, ICAP, upgrades, housekeeping)
# is identical to squid.conf and must stay in step with it; a test asserts so.
#
# VERIFY before trusting (see spec §11): `squid -k parse -f` in the
# squid-openssl image, then a live mTLS handshake — valid cert is bumped and
# screened, no cert is refused at the handshake, valid cert to a non-AI host is
# denied. The exact require-vs-request client-cert flag is the line to confirm.

# The laptop's PAC uses `HTTPS proxy:8443`, so the client->proxy hop is itself
# TLS and the client certificate is never sent in the clear.
#   tls-cert/tls-key : the interception CA (trusted on devices by MDM). It signs
#                      both the forged per-site AI certs and the proxy's own
#                      endpoint certificate.
#   clientca         : the MDM issuing CA. Squid verifies each client cert
#                      against it; tls-default-ca=off so public CAs are not
#                      accepted as device identity.
https_port 8443 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=8MB \
  tls-cert=/etc/squid/ssl/ca.pem \
  tls-key=/etc/squid/ssl/ca.pem \
  clientca=/etc/squid/ssl/client-ca.pem \
  tls-default-ca=off

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 32MB
sslcrtd_children 32 startup=8 idle=4

# --- who may use the proxy -----------------------------------------------
# PUBLIC endpoint: there is NO source-IP allow-list. A client is authenticated
# by its mTLS certificate at the TLS layer (clientca above). Authorization here
# is by DESTINATION: only AI hosts, so a valid cert still cannot relay
# elsewhere. ai_dst (CONNECT target, pre-SNI) mirrors ai_hosts (SNI, at bump).
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl ai_dst dstdomain .chatgpt.com .claude.ai .gemini.google.com \
                     .copilot.microsoft.com .perplexity.ai \
                     .grok.com .deepseek.com .meta.ai .poe.com \
                     .openai.com .anthropic.com \
                     .generativelanguage.googleapis.com \
                     .githubcopilot.com .api.cohere.ai \
                     .mistral.ai .api.groq.com .api.x.ai \
                     .openrouter.ai

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost
# Client authentication is enforced at the TLS layer by clientca +
# tls-default-ca=off on https_port above: a handshake without a cert that
# verifies to the MDM issuing CA is rejected before any request is made, so no
# http_access rule for "has a cert" is needed here. Authorization below is by
# destination only. (The exact require-vs-request flag is the line the parse +
# handshake gate confirms, spec §11.)
http_access deny CONNECT !ai_dst
http_access allow CONNECT ai_dst
http_access deny all

# --- what gets decrypted --------------------------------------------------
# Keep in sync with DEFAULT_AI_HOSTS in icap/config.py and ai_dst above.
acl ai_hosts ssl::server_name .chatgpt.com .claude.ai .gemini.google.com \
                              .copilot.microsoft.com .perplexity.ai \
                              .grok.com .deepseek.com .meta.ai .poe.com \
                              .openai.com .anthropic.com \
                              .generativelanguage.googleapis.com \
                              .githubcopilot.com .api.cohere.ai \
                              .mistral.ai .api.groq.com .api.x.ai \
                              .openrouter.ai

# Never decrypted. Keep this in sync with SHIELD_ICAP_BYPASS_HOSTS. (On this
# AI-only proxy these are unreachable anyway — ai_dst denies them — but kept
# for parity with squid.conf so the two configs do not diverge.)
acl never_bump ssl::server_name .chase.com .bankofamerica.com .wellsfargo.com \
                                .paypal.com .workday.com .adp.com \
                                .okta.com .onelogin.com .duosecurity.com

acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3

ssl_bump peek   step1
ssl_bump splice never_bump
ssl_bump bump   ai_hosts
ssl_bump splice all

# --- protocol upgrades (WebSocket) ----------------------------------------
http_upgrade_request_protocols websocket allow
http_upgrade_request_protocols OTHER deny

# --- hand decrypted requests to Shield ------------------------------------
icap_enable on
icap_preview_enable on
icap_preview_size 4096
icap_send_client_ip on
icap_send_client_username on
icap_service shield_req reqmod_precache icap://shield-icap:1344/screen bypass=off

acl ws_upgrade req_header Upgrade -i websocket
adaptation_access shield_req deny ws_upgrade
adaptation_access shield_req allow ai_hosts
adaptation_access shield_req deny all

# --- housekeeping ---------------------------------------------------------
cache deny all
access_log stdio:/dev/stdout squid
strip_query_terms on
via off
forwarded_for delete
dns_v4_first on
