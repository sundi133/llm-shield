# Squid for the public laptop SWG, BEHIND the nginx mTLS terminator.
# Spec: docs/spec-swg-public-proxy.md.
#
# Squid cannot both terminate the client's TLS (https_port) and ssl-bump in
# forward-proxy mode -- `FATAL: ssl-bump on https_port requires intercept`. So
# mTLS is nginx's job (deploy/swg/nginx-mtls.conf): nginx verifies the device
# client cert on 8443 and forwards the decrypted forward-proxy protocol here,
# to a plaintext http_port that bumps AI hosts as usual.
#
# This is the base squid.conf (http_port ssl-bump + ICAP) plus a DESTINATION
# allow-list: only AI hosts, so even reaching Squid behind nginx cannot relay
# elsewhere. 3128 is bound to the docker bridge only (never published to the
# host); nginx reaches it by container name.

http_port 3128 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=8MB \
  tls-cert=/etc/squid/ssl/ca.pem \
  tls-key=/etc/squid/ssl/ca.pem

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 32MB
sslcrtd_children 32 startup=8 idle=4

# --- who may use the proxy -----------------------------------------------
# Authentication (the device client cert) is enforced by nginx in front. Here
# the control is the DESTINATION: only AI hosts. ai_dst (CONNECT target,
# pre-SNI) mirrors ai_hosts (SNI, at bump).
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl ai_dst dstdomain .chatgpt.com .claude.ai .gemini.google.com \
                     .copilot.microsoft.com .perplexity.ai \
                     .grok.com .deepseek.com .meta.ai .poe.com \
                     .openai.com .anthropic.com \
                     .generativelanguage.googleapis.com \
                     .githubcopilot.com .api.cohere.ai \
                     .mistral.ai .api.groq.com .api.x.ai \
                     .openrouter.ai

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost
# CONNECT (the tunnel target, pre-bump) may only be an AI host.
http_access deny CONNECT !ai_dst
# After bump, the decrypted inner request is re-evaluated and is NOT a CONNECT;
# restrict those (and any absolute-URI relay attempt) to AI hosts too, then
# allow. Without this the bumped GET falls through to `deny all` -> 403 on a
# host we meant to allow. No source-IP allow (no `localnet`): the client is
# authenticated by the nginx mTLS front, and the destination is the control.
http_access deny !ai_dst
http_access allow ai_dst
http_access deny all

# --- what gets decrypted --------------------------------------------------
# Keep in sync with DEFAULT_AI_HOSTS in icap/config.py and ai_dst above.
acl ai_hosts ssl::server_name .chatgpt.com .claude.ai .gemini.google.com \
                              .copilot.microsoft.com .perplexity.ai \
                              .grok.com .deepseek.com .meta.ai .poe.com \
                              .openai.com .anthropic.com \
                              .generativelanguage.googleapis.com \
                              .githubcopilot.com .api.cohere.ai \
                              .mistral.ai .api.groq.com .api.x.ai \
                              .openrouter.ai

# Never decrypted. Kept in sync with squid.conf (unreachable here anyway -
# ai_dst denies them - but kept so the two configs do not diverge).
acl never_bump ssl::server_name .chase.com .bankofamerica.com .wellsfargo.com \
                                .paypal.com .workday.com .adp.com \
                                .okta.com .onelogin.com .duosecurity.com

acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3

ssl_bump peek   step1
ssl_bump splice never_bump
ssl_bump bump   ai_hosts
ssl_bump splice all

# --- protocol upgrades (WebSocket) ----------------------------------------
http_upgrade_request_protocols websocket allow
http_upgrade_request_protocols OTHER deny

# --- hand decrypted requests to Shield ------------------------------------
icap_enable on
icap_preview_enable on
icap_preview_size 4096
icap_send_client_ip on
icap_send_client_username on
icap_service shield_req reqmod_precache icap://shield-icap:1344/screen bypass=off

acl ws_upgrade req_header Upgrade -i websocket
adaptation_access shield_req deny ws_upgrade
adaptation_access shield_req allow ai_hosts
adaptation_access shield_req deny all

# --- housekeeping ---------------------------------------------------------
cache deny all
access_log stdio:/dev/stdout squid
strip_query_terms on
via off
forwarded_for delete
dns_v4_first on
