apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shield-identity.fullname" . }}-envoy
  labels:
    {{- include "shield-identity.labels" . | nindent 4 }}
data:
  # Template: an initContainer substitutes __SHIELD_PROXY_TOKEN__ from the Secret
  # so the token never lives in this ConfigMap.
  envoy.yaml.tmpl: |
    node: { id: shield-identity-envoy, cluster: shield-identity }
    static_resources:
      listeners:
        - name: mtls_ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: {{ .Values.envoy.listenPort }} }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details: { uri: true, cert: true }
                    route_config:
                      name: to_shield
                      request_headers_to_add:
                        - header: { key: "X-Shield-Proxy-Token", value: "__SHIELD_PROXY_TOKEN__" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      virtual_hosts:
                        - name: shield
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: shield_upstream }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: default
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services: [{ envoy_grpc: { cluster_name: spire_agent } }]
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher: { prefix: "spiffe://{{ .Values.trustDomain }}/" }
                      validation_context_sds_secret_config:
                        name: ROOTCA
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services: [{ envoy_grpc: { cluster_name: spire_agent } }]
      clusters:
        - name: spire_agent
          connect_timeout: 1s
          type: STATIC
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config: { http2_protocol_options: {} }
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: { path: "{{ .Values.spiffeCSI.socketPath }}" }
        - name: shield_upstream
          connect_timeout: 2s
          type: STRICT_DNS
          load_assignment:
            cluster_name: shield_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.shield.upstreamHost | quote }}
                          port_value: {{ .Values.shield.upstreamPort }}
