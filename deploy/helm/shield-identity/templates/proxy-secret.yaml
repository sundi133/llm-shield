{{- if and .Values.proxySecret.value (not .Values.proxySecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shield-identity.proxySecretName" . }}
  labels:
    {{- include "shield-identity.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Envoy injects this as X-Shield-Proxy-Token; must equal Shield's
  # SHIELD_TRUSTED_PROXY_SECRET. For stricter hygiene set proxySecret.existingSecret
  # instead and manage the value in your secrets manager.
  token: {{ .Values.proxySecret.value | quote }}
{{- end }}
