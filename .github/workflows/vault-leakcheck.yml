name: Vault leak check

# Security gate: run the secret-vault use-case scripts, which assert that a
# bound secret is delivered only to its bound destination/tool and is never
# revealed to the model or an unbound host. Each script exits non-zero if any
# security property breaks, so a regression that leaks a secret fails the build.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  vault-leakcheck:
    name: vault leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run vault leak-check scenarios
        # PYTHONPATH=. so the example scripts import core/, storage/ from the repo root.
        run: |
          PYTHONPATH=. python examples/secret_vault_scenarios.py
          PYTHONPATH=. python examples/secret_vault_env_ab.py
          PYTHONPATH=. python examples/secret_vault_langchain_weather.py
