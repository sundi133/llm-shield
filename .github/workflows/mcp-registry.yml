name: regenerate MCP registry

# Rescans the curated public MCP servers (registry/servers.yaml) and opens a PR
# with the refreshed ratings under docs/registry/. It does NOT push to main —
# every rating change is human-reviewed before it publishes.
#
# SAFETY: rating a `stdio:` server executes third-party code (npx/uvx) to complete
# the MCP handshake. That runs only here, in an ephemeral throwaway GitHub runner,
# against a curated + version-pinned list, with a per-scan timeout, in OFFLINE scan
# mode (no Shield URL, no secrets). It never runs on a plane, on fork PRs, or on a
# developer machine.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Regenerate a single slug (blank = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  regenerate:
    # Never run on forks; this executes third-party server code.
    if: github.repository == 'sundi133/llm-shield'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runtimes the curated targets launch (npx / uvx).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv (for uvx targets)
        run: python -m pip install uv

      - name: Install scanner + generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/shield-mcp ./packages/mcp-registry

      - name: Regenerate ratings
        run: |
          mcp-registry \
            --servers registry/servers.yaml \
            --out docs/registry \
            --timeout 30 \
            --only "${{ github.event.inputs.only }}"

      - name: Open PR with refreshed ratings
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/mcp-registry-refresh
          title: "chore(mcp-registry): refresh security ratings"
          commit-message: "chore(mcp-registry): refresh security ratings"
          body: |
            Automated rescan of the curated public MCP servers
            (`registry/servers.yaml`). Review the rating changes below before merging;
            a shift to `high-risk`/`unrated` is worth a look at the findings.

            Generated by `.github/workflows/mcp-registry.yml`.
          add-paths: |
            docs/registry/**
          delete-branch: true
