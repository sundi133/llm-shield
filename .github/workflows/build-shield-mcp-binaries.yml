name: build shield-mcp binaries

# Freezes packages/shield-mcp into single-file `shield-mcp` binaries with
# PyInstaller across an OS/arch matrix, and (on a release tag) attaches them plus
# a SHA256SUMS to the GitHub Release. These are the checksum-verified download
# targets for the `@votal/mcp-scan` npx fallback (Phase 2 Task 3).
#
# Triggers:
#   - push a tag `shield-mcp-v*`  -> build ALL targets + attach to the Release
#   - manual "Run workflow"       -> build ALL targets as artifacts (no Release)

on:
  push:
    tags:
      - "shield-mcp-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-13,         target: macos-x64 }
          - { os: macos-14,         target: macos-arm64 }
          - { os: windows-latest,   target: windows-x64, ext: ".exe" }
    defaults:
      run:
        shell: bash
        working-directory: packages/shield-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install .

      - name: Freeze single-file binary
        run: |
          rm -rf build dist shield-mcp.spec
          pyinstaller --onefile --name shield-mcp \
            --collect-all mcp --collect-submodules shield_mcp \
            pyinstaller_entry.py

      - name: Smoke test (must run a real command)
        run: |
          BIN="dist/shield-mcp${{ matrix.ext }}"
          "$BIN" scan --help
          "$BIN" scan "ftp://nope" ; test $? -eq 4  # usage error exit code intact

      - name: Stage asset
        run: |
          cp "dist/shield-mcp${{ matrix.ext }}" \
             "shield-mcp-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: shield-mcp-${{ matrix.target }}
          path: packages/shield-mcp/shield-mcp-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/shield-mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create/update the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: shield-mcp-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist-artifacts
        run: |
          sha256sum shield-mcp-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/shield-mcp-*
            dist-artifacts/SHA256SUMS
