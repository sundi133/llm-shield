name: Tests

# Gate: run the offline test suite on every PR and on pushes to main.
# The suite runs without a model/GPU or live Redis (in-process fallback),
# so it is a fast, deterministic merge gate. Enable "Require status checks
# to pass" on main in branch protection to make this blocking.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run test suite
        # `python -m pytest` puts the repo root on sys.path so the top-level
        # packages (core/, api/, storage/) import without a src layout.
        run: python -m pytest tests -q

  redis-clients:
    # The cloud runs on the upstash_redis REST client, on-prem on redis-py over
    # TCP, and their pipelines differ. The suite above uses the in-process
    # fallback, which hid four cloud-only failures. Run the store flows with
    # BOTH real clients against a real Redis 7 (tests/test_redis_client_compat.py).
    name: redis clients (upstash + redis-py)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run the store flows on both clients
        env:
          SHIELD_TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m pytest tests/test_redis_client_compat.py -q -rs

  openshift-manifests:
    # The openshift/ Kustomize tree customers install with `oc apply -k`
    # (docs/specs/onprem-release-bundle.md). Build every overlay with the
    # Kustomize built into kubectl and validate it against the Kubernetes
    # schemas. Route (OpenShift-only) has no schema here; its fields are checked
    # by tests/test_openshift_manifests.py in the pytest job.
    name: openshift manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform (pinned, checksum-verified)
        run: |
          curl -sSLo /tmp/kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
      - name: Build and validate every overlay
        run: |
          for overlay in openshift/overlays/*/; do
            echo "== ${overlay}"
            kubectl kustomize "${overlay}" | /tmp/kubeconform -strict -summary -skip Route -kubernetes-version 1.28.0
          done

  hook-windows:
    # The PowerShell hook, run for real under pwsh and Windows PowerShell 5.1,
    # including the managed-mode ACL checks (docs/specs/hooks-plugin-production.md).
    name: hook script (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the PowerShell hook tests, and the kit's installer for real
        env:
          VOTAL_KIT_E2E: "1"
        run: python -m pytest --noconftest tests/test_hook_script_windows.py -q -rs

  hook-kit-linux:
    # The kit's installer run for real as root on a throwaway runner, then the
    # hook as the runner user (docs/specs/hooks-plugin-production.md task 3).
    name: hook kit install (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Install the kit as root and run the hook
        env:
          VOTAL_KIT_E2E: "1"
        run: python -m pytest --noconftest tests/test_hook_kit_install_e2e.py -q -rs

  claude-code-plugin:
    # The votal-shield-hooks plugin inside the real Claude Code CLI, against a
    # scripted model and a fake Shield (tests/test_claude_code_plugin_e2e.py):
    # a denied call never runs, a result is redacted, a blocked prompt never
    # reaches the model. On Windows the plugin's .sh runs in Git Bash and hands
    # over to the .ps1 (docs/specs/hooks-plugin-production.md task 4).
    name: claude code plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code and pytest
        run: |
          npm install -g @anthropic-ai/claude-code
          python -m pip install pytest
          claude --version
      - name: Run Claude Code with the plugin
        env:
          VOTAL_CLAUDE_E2E: "1"
          CLAUDE_CODE_GIT_BASH_PATH: ${{ runner.os == 'Windows' && 'C:\Program Files\Git\bin\bash.exe' || '' }}
        run: python -m pytest --noconftest tests/test_claude_code_plugin_e2e.py -q -rs

  extension:
    name: extension (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate manifest + run edge engine tests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node --test extension/test/*.mjs
      - name: Browser extension (VotalAI Guardrails) unit tests
        run: node --test examples/browser-extension/test/*.test.js

  mcp-scan-npm:
    name: mcp-scan npm wrapper (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test + publish dry-run
        working-directory: packages/mcp-scan-npm
        run: |
          node --test
          npm pack --dry-run
