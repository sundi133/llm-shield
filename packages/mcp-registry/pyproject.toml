[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-registry"
version = "0.1.0"
description = "Score public MCP servers 0-100 from shield-mcp scan results and generate a static security-ratings directory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Votal / LLM Shield" }]
keywords = ["mcp", "security", "registry", "ratings", "audit"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = [
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]
