<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
  </defs>
  <rect width="1400" height="800" fill="#FFFFFF"/>

  <text x="40" y="50" font-size="28" font-weight="bold" fill="#1B2433">How Shield stops AI agents posing as your customers</text>
  <text x="40" y="80" font-size="16" fill="#5B6474">Shield watches the logs you already have, spots AI agents and the fleets behind them, and your existing firewall stops the rest.</text>

  <!-- step numbers -->
  <g font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <circle cx="60" cy="125" r="15" fill="#1B2433"/><text x="60" y="130">1</text>
    <circle cx="340" cy="125" r="15" fill="#1B2433"/><text x="340" y="130">2</text>
    <circle cx="620" cy="125" r="15" fill="#1B2433"/><text x="620" y="130">3</text>
    <circle cx="900" cy="125" r="15" fill="#1B2433"/><text x="900" y="130">4</text>
    <circle cx="1180" cy="125" r="15" fill="#1B2433"/><text x="1180" y="130">5</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#1B2433">
    <text x="84" y="130">Visitors arrive</text>
    <text x="364" y="130">Your site records them</text>
    <text x="644" y="130">Logs go to your SIEM</text>
    <text x="924" y="130">Shield finds the agents</text>
    <text x="1204" y="130">Your firewall acts</text>
  </g>

  <!-- 1 visitors -->
  <rect x="40" y="148" width="230" height="200" rx="12" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <rect x="55" y="163" width="200" height="46" rx="8" fill="#F2F4F7"/>
  <text x="70" y="191" font-size="15" fill="#1B2433">Real people</text>
  <rect x="55" y="219" width="200" height="46" rx="8" fill="#EFE7F7"/>
  <text x="70" y="247" font-size="15" fill="#5B2C83">Good AI agents</text>
  <rect x="55" y="275" width="200" height="60" rx="8" fill="#FDECEC"/>
  <text x="70" y="299" font-size="15" font-weight="bold" fill="#8B0000">AI agent fleets</text>
  <text x="70" y="320" font-size="13" fill="#8B0000">posing as people</text>

  <!-- 2 site -->
  <rect x="320" y="148" width="230" height="200" rx="12" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="338" y="180" font-size="17" font-weight="bold" fill="#1B2433">Your website or app</text>
  <text x="338" y="210" font-size="14" fill="#333333">Real pages, plus decoys</text>
  <text x="338" y="230" font-size="14" fill="#8A5A00">only attackers open</text>
  <rect x="335" y="244" width="200" height="94" rx="8" fill="#FBE5D6" stroke="#C55A11" stroke-dasharray="5 3"/>
  <text x="348" y="266" font-size="13" font-weight="bold" fill="#C55A11">Optional: Shield tag</text>
  <text x="348" y="287" font-size="13" fill="#333333">sees how visitors</text>
  <text x="348" y="305" font-size="13" fill="#333333">click and type, never</text>
  <text x="348" y="323" font-size="13" fill="#333333">what they type</text>

  <!-- 3 SIEM -->
  <rect x="600" y="148" width="230" height="200" rx="12" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <text x="618" y="180" font-size="17" font-weight="bold" fill="#1B2433">Your SIEM</text>
  <text x="618" y="210" font-size="14" fill="#333333">Splunk, Sentinel</text>
  <text x="618" y="230" font-size="14" fill="#333333">or Elastic</text>
  <text x="618" y="266" font-size="14" fill="#333333">Shield reads your web</text>
  <text x="618" y="286" font-size="14" fill="#333333">and login logs with a</text>
  <text x="618" y="306" font-size="14" fill="#333333">read-only account</text>

  <!-- 4 Shield -->
  <rect x="880" y="148" width="230" height="200" rx="12" fill="#1F4E79"/>
  <text x="898" y="180" font-size="19" font-weight="bold" fill="#FFFFFF">Shield</text>
  <text x="898" y="210" font-size="14" fill="#FFFFFF">Finds AI agents and the</text>
  <text x="898" y="230" font-size="14" fill="#FFFFFF">fleets behind them,</text>
  <text x="898" y="250" font-size="14" fill="#FFFFFF">within minutes</text>
  <text x="898" y="286" font-size="14" fill="#DCE8F5">Alerts your security</text>
  <text x="898" y="306" font-size="14" fill="#DCE8F5">team, with the evidence</text>

  <!-- 5 firewall -->
  <rect x="1160" y="148" width="210" height="200" rx="12" fill="#E2F0D9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1178" y="180" font-size="17" font-weight="bold" fill="#2E7D32">Firewall or CDN</text>
  <text x="1178" y="210" font-size="14" fill="#1B2433">Challenges or blocks</text>
  <text x="1178" y="230" font-size="14" fill="#1B2433">the rest of the fleet</text>
  <text x="1178" y="266" font-size="14" fill="#1B2433">Fake accounts are</text>
  <text x="1178" y="286" font-size="14" fill="#1B2433">flagged for review</text>
  <text x="1178" y="322" font-size="12" fill="#5B6474">using tools you already run</text>

  <!-- arrows -->
  <line x1="272" y1="248" x2="316" y2="248" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="552" y1="248" x2="596" y2="248" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="832" y1="248" x2="876" y2="248" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1112" y1="248" x2="1156" y2="248" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M1265,350 L1265,372 L155,372 L155,352" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="560" y="392" font-size="13" fill="#2E7D32">The next sandboxes in the fleet are stopped at the door</text>

  <!-- how it spots them -->
  <text x="40" y="440" font-size="20" font-weight="bold" fill="#1B2433">How Shield tells an AI agent from a person</text>

  <rect x="40" y="458" width="256" height="150" rx="12" fill="#F2F4F7"/>
  <text x="58" y="490" font-size="16" font-weight="bold" fill="#1B2433">Acts like a machine</text>
  <text x="58" y="518" font-size="14" fill="#333333">Clicks the exact centre of</text>
  <text x="58" y="538" font-size="14" fill="#333333">buttons, types at a steady</text>
  <text x="58" y="558" font-size="14" fill="#333333">pace, never makes a typo.</text>
  <text x="58" y="588" font-size="13" fill="#5B6474">Emulators: sensors never move.</text>
  <rect x="308" y="458" width="256" height="150" rx="12" fill="#F2F4F7"/>
  <text x="326" y="490" font-size="16" font-weight="bold" fill="#1B2433">Falls for hidden traps</text>
  <text x="326" y="518" font-size="14" fill="#333333">Follows instructions people</text>
  <text x="326" y="538" font-size="14" fill="#333333">can't see, like "enter 7391</text>
  <text x="326" y="558" font-size="14" fill="#333333">in this field".</text>
  <text x="326" y="588" font-size="13" fill="#5B6474">Hidden from screen readers too.</text>
  <rect x="576" y="458" width="256" height="150" rx="12" fill="#FFF4CC"/>
  <text x="594" y="490" font-size="16" font-weight="bold" fill="#8A5A00">Touches decoys</text>
  <text x="594" y="518" font-size="14" fill="#333333">Fake admin page, fake .env</text>
  <text x="594" y="538" font-size="14" fill="#333333">file, fake API key. No real</text>
  <text x="594" y="558" font-size="14" fill="#333333">user ever needs them.</text>
  <text x="594" y="588" font-size="13" fill="#5B6474">Only an AI obeys the note inside.</text>
  <rect x="844" y="458" width="256" height="150" rx="12" fill="#F2F4F7"/>
  <text x="862" y="490" font-size="16" font-weight="bold" fill="#1B2433">Moves as a crowd</text>
  <text x="862" y="518" font-size="14" fill="#333333">3,000 sign-ups in an hour,</text>
  <text x="862" y="538" font-size="14" fill="#333333">many IPs and devices, same</text>
  <text x="862" y="558" font-size="14" fill="#333333">steps, start and stop together.</text>
  <text x="862" y="588" font-size="13" fill="#5B6474">Normal alone, obvious together.</text>
  <rect x="1112" y="458" width="256" height="150" rx="12" fill="#EFE7F7"/>
  <text x="1130" y="490" font-size="16" font-weight="bold" fill="#5B2C83">Good agents get through</text>
  <text x="1130" y="518" font-size="14" fill="#333333">Agents that prove who they</text>
  <text x="1130" y="538" font-size="14" fill="#333333">are (Web Bot Auth) are</text>
  <text x="1130" y="558" font-size="14" fill="#333333">recognised, not blocked.</text>
  <text x="1130" y="588" font-size="13" fill="#5B6474">A faked signature is a red flag.</text>

  <!-- promises -->
  <text x="40" y="660" font-size="20" font-weight="bold" fill="#1B2433">What you can count on</text>
  <g font-size="14" fill="#1B2433">
    <rect x="40" y="678" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="60" y="708" font-weight="bold">No slowdown</text>
    <text x="60" y="730">Shield is never in the path of your traffic</text>
    <rect x="375" y="678" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="395" y="708" font-weight="bold">Uses what you have</text>
    <text x="395" y="730">Your SIEM, firewall and CDN do the work</text>
    <rect x="710" y="678" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="730" y="708" font-weight="bold">Watch first</text>
    <text x="730" y="730">Nothing is blocked until you switch it on</text>
    <rect x="1045" y="678" width="325" height="72" rx="12" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="1065" y="708" font-weight="bold">Easy to undo</text>
    <text x="1065" y="730">Blocks expire; one switch clears all</text>
  </g>
</svg>
